name: component-storybook8
on:
  push:
    branches:
    - main

permissions:
  contents: write
  
jobs:
  component-storybook8: 
    name: component-storybook8
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
          submodules: recursive
          fetch-depth: 0
    - name: Checkout submodules to dev branch
      run: |
        git submodule update --init --recursive
        git submodule foreach 'git fetch --all'
        git submodule foreach 'git checkout dev'
        git submodule foreach 'git pull origin dev'
        git submodule foreach 'npm install'

    - uses: actions/setup-node@v3
      with:
        node-version: '20'
    - run: npm install
    - run: npm run build-storybook
    
    - name: Deploy GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: storybook-static
        git-config-name: GitHubActions
        git-config-email: GitHubActions@github.com
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy to Staging server
      uses: easingthemes/ssh-deploy@main
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        ARGS: "-rlgoDzvc -i --delete"
        SOURCE: "storybook-static/"
        REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
        REMOTE_USER: ${{ secrets.REMOTE_USER }}
        TARGET: ${{ secrets.REMOTE_TARGET }}
        EXCLUDE: "/dist/, /storybook-static/, /node_modules/"
        SCRIPT_BEFORE: |
          whoami
          ls -al
        SCRIPT_AFTER: |
          whoami
          ls -al
          echo $RSYNC_STDOUT

    - name: Set short git commit SHA
      id: vars
      run: |
        calculatedSha=$(git rev-parse --short ${{ github.sha }})
        echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV

    # 发送企业微信通知
    - name: WeChat Work notification
      uses: chf007/action-wechat-work@master
      env:
        WECHAT_WORK_BOT_WEBHOOK: ${{secrets.WECHAT_WORK_BOT_WEBHOOK}}
      with:
        msgtype: markdown
        content: "兄弟们，咱们的文档更新啦！\n
        > 变更日志 [${{ env.COMMIT_SHORT_SHA }}](https://github.com/${{github.repository}}/commit/${{github.sha}})\n
        > <font color=\"comment\">${{ github.event.head_commit.message }}</font>\n
        [查看文档](https://ksw-storybook.design.donxj.com/)"